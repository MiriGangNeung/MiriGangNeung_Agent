name: Agent CI

# main에 병합될 때마다 테스트를 통과한 코드로 배포용 Docker 이미지를 만들어
# GitHub Container Registry(ghcr.io)에 올린다. PR에서는 같은 검사와 이미지 빌드를
# 돌리되 올리지는 않는다 — 병합 전에 Dockerfile이 깨졌는지 미리 알 수 있다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # 얼굴 인식 모델(SFace)은 git에 없어 여기서는 없는 상태로 돈다. 모델이 없을 때의
      # 동작(유사도 판정 생략)을 테스트가 따로 검증하므로 결과에 영향이 없다.
      - name: Test
        run: pytest -q

  image:
    name: Build image${{ github.event_name != 'pull_request' && ' & publish' || '' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 이미지 이름은 소문자여야 한다. 조직·레포 이름에 대문자가 있어 직접 변환한다.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
